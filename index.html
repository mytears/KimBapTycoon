<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141620">
  <title>분식타이쿤</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="service.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><img class="brand-mark" src="assets/logo.png" alt=""><div><h1>분식<span>타이쿤</span></h1><p id="daily-goal" aria-live="polite"></p></div></div>
      <nav aria-label="게임 화면">
        <button data-page="play" aria-current="page"><i data-icon="store"></i>영업</button>
        <button data-page="manage"><i data-icon="upgrade"></i>가게 관리</button>
        <button data-page="journal"><i data-icon="book"></i>영업 일지</button>
        <button data-page="achievements"><i data-icon="trophy"></i>업적</button>
      </nav>
      <div class="tools"><button id="sound" class="icon-button" aria-label="효과음 켜기"><i data-icon="muted"></i></button><button id="settings" class="icon-button" aria-label="설정" title="설정"><i data-icon="gear"></i></button></div>
    </header>
    <main>
      <section id="play" aria-label="가게 영업">
        <div class="storefront">
          <div class="scene" id="scene">
            <div class="scene-world">
              <img id="shop-image" class="shop" src="assets/art/storefront-morning.webp" alt="아침의 별밤분식과 골목">
              <div id="shop-decor" class="shop-decor"></div>
              <div id="shop-owner" class="shop-owner" role="img" aria-label="주문을 기다리는 사장님"><span class="owner-figure"></span></div>
              <div class="counter-edge" aria-hidden="true"></div>
              <div id="equipment"></div>
              <img id="staff-sprite" class="staff-sprite" src="assets/art/staff.webp" alt="가게 밖 화구 앞에 서 있는 여성 조리 직원" hidden>
              <div id="patrons" class="patrons" aria-label="매장 앞 손님"></div>
              <div id="departures" class="patrons" aria-label="떠나는 손님 반응"></div>
            </div>
            <span class="scene-period" id="scene-period"></span>
          </div>
          <div class="hud">
            <div class="shift"><i id="shift-icon"></i><b id="day">1일차</b><span id="time">07:00</span></div>
            <div class="daily-count"><i data-icon="ticket"></i><span>판매</span><b id="served">0건</b></div>
            <div class="grade" aria-label="가게 평점"><i aria-hidden="true">★</i><b id="rating">—</b></div>
            <div class="wallet"><i data-icon="coin"></i><span>보유 자금</span><b id="balance">10,000원</b></div>
          </div>
        </div>
        <div class="workbench">
          <section class="panel queue-panel">
            <div class="panel-head"><h2><i data-icon="people"></i>대기 주문</h2><span class="count" id="queue-count">1 / 5명</span></div>
            <div class="queue-body"><div id="current-order"></div><div class="waiting-head"><h3>다음 손님</h3><small id="arrival"></small></div><ol id="waiting" aria-label="다음 주문 순서"></ol></div>
          </section>
          <section class="panel kitchen-panel">
            <div class="panel-head"><h2><i data-icon="pan"></i>조리대</h2><button id="cookbook" class="text-button"><i data-icon="book"></i>메뉴판 <b>9</b><i data-icon="chevron"></i></button></div>
            <div class="kitchen-body" id="kitchen"></div>
          </section>
        </div>
      </section>
      <section id="manage" class="subpage" aria-label="가게 관리" hidden></section>
      <section id="journal" class="subpage" aria-label="영업 일지" hidden></section>
      <section id="achievements" class="subpage" aria-label="업적" hidden></section>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"><div class="dialog-inner"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dismiss" class="icon-button" aria-label="닫기"><i data-icon="close"></i></button></div><div id="dialog-body"></div></div></dialog>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
</body>
</html>
